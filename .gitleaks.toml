# Gitleaks config for codex-universal / evechat.
# Keep allowlists narrow. Prefer fixing real leaks over silencing rules.

title = "codex-universal"

[extend]
useDefault = true

[allowlist]
description = "Docs and empty env templates that name secret variables without values"
paths = [
  '''evechat/\.env\.example$''',
]
regexTarget = "match"
regexes = [
  # Empty assignments in templates / docs (KEY= with no value on the same line)
  '''(?i)(?:BETTER_AUTH_SECRET|SCW_SECRET_KEY|VERCEL_APP_CLIENT_SECRET|UPSTASH_REDIS_REST_TOKEN|KV_REST_API_TOKEN|SCALEWAY_API_KEY|EVE_MODEL_API_KEY)=\s*$''',
]
